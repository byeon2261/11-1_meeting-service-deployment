name: meeting-service

services:
  api:
    image: meeting-api:v1
    env_file:
      - .env
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8000"
    expose:
      - "8000"
    networks:
      - service

  web:
    image: meeting-web:v1
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - service

networks:
  service:
    driver: bridge